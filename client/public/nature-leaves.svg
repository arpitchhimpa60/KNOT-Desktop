<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48bb78" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#2FA84F" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#176B38" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#68d391" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#38a169" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#22543d" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="leafGradSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ae6b4" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#48bb78" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f855a" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1c4532" stop-opacity="0.85" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Top-Left Corner Foliage -->
  <g class="corner-top-left" opacity="0.85">
    <!-- Main stem -->
    <path d="M-40 -40 Q 60 80 160 110 T 260 120" stroke="url(#stemGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M50 70 Q 110 30 180 20" stroke="url(#stemGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M110 95 Q 160 170 200 210" stroke="url(#stemGrad)" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Leaf Cluster 1 -->
    <path d="M-20 20 C 10 30 40 80 35 110 C 15 115 -15 85 -20 20 Z" fill="url(#leafGrad1)" />
    <path d="M-20 20 Q 15 80 35 110" stroke="#176B38" stroke-width="1.5" stroke-opacity="0.4" fill="none" />

    <!-- Leaf Cluster 2 -->
    <path d="M40 70 C 80 50 140 60 160 30 C 150 10 100 20 40 70 Z" fill="url(#leafGrad2)" />
    <path d="M40 70 Q 110 45 160 30" stroke="#176B38" stroke-width="1.5" stroke-opacity="0.4" fill="none" />

    <!-- Leaf Cluster 3 -->
    <path d="M90 90 C 130 90 190 130 210 110 C 200 80 140 70 90 90 Z" fill="url(#leafGrad1)" />
    <path d="M90 90 Q 160 105 210 110" stroke="#176B38" stroke-width="1.5" stroke-opacity="0.4" fill="none" />

    <!-- Leaf Cluster 4 -->
    <path d="M140 105 C 190 120 250 140 275 115 C 255 90 200 95 140 105 Z" fill="url(#leafGrad2)" />
    <path d="M140 105 Q 215 115 275 115" stroke="#176B38" stroke-width="1.5" stroke-opacity="0.4" fill="none" />

    <!-- Hanging Leaf Cluster -->
    <path d="M110 95 C 120 145 150 195 185 215 C 195 185 165 135 110 95 Z" fill="url(#leafGrad1)" />
    <path d="M110 95 Q 150 165 185 215" stroke="#176B38" stroke-width="1.5" stroke-opacity="0.4" fill="none" />

    <!-- Subtle smaller background leaves -->
    <path d="M10 -10 C 35 10 65 40 55 60 C 35 65 15 45 10 -10 Z" fill="url(#leafGradSoft)" opacity="0.6" />
    <path d="M170 30 C 200 20 235 25 245 10 C 235 -5 200 5 170 30 Z" fill="url(#leafGradSoft)" opacity="0.6" />
    <path d="M165 180 C 185 220 220 240 235 230 C 235 205 200 185 165 180 Z" fill="url(#leafGradSoft)" opacity="0.5" />
    
    <!-- Floating tiny leaves -->
    <path d="M220 70 C 235 65 250 75 255 70 C 250 60 235 55 220 70 Z" fill="#48bb78" opacity="0.75" />
    <path d="M290 135 C 305 130 315 140 320 135 C 315 125 300 120 290 135 Z" fill="#2FA84F" opacity="0.7" />
    <path d="M190 250 C 200 260 215 265 220 255 C 215 245 200 240 190 250 Z" fill="#38a169" opacity="0.65" />
  </g>

  <!-- Bottom-Left Foliage -->
  <g class="corner-bottom-left" opacity="0.8">
    <path d="M-30 630 Q 50 520 130 480 T 220 460" stroke="url(#stemGrad)" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M30 550 C 60 520 110 520 130 490 C 115 470 70 480 30 550 Z" fill="url(#leafGrad2)" />
    <path d="M90 500 C 130 480 180 490 200 460 C 185 440 135 450 90 500 Z" fill="url(#leafGrad1)" />
    <path d="M-10 580 C 20 560 60 580 75 550 C 60 530 20 540 -10 580 Z" fill="url(#leafGradSoft)" opacity="0.55" />
    <path d="M160 470 C 190 460 225 465 240 450 C 230 435 195 440 160 470 Z" fill="url(#leafGrad2)" />
    <path d="M230 430 C 245 425 255 435 260 430 C 255 420 240 415 230 430 Z" fill="#2FA84F" opacity="0.7" />
  </g>

  <!-- Top-Right Foliage -->
  <g class="corner-top-right" opacity="0.85">
    <path d="M840 -40 Q 740 70 650 95 T 550 110" stroke="url(#stemGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M760 50 C 720 30 670 40 650 10 C 665 -10 710 0 760 50 Z" fill="url(#leafGrad1)" />
    <path d="M700 80 C 660 70 610 100 585 80 C 600 55 650 55 700 80 Z" fill="url(#leafGrad2)" />
    <path d="M630 100 C 580 105 530 125 505 105 C 520 85 570 85 630 100 Z" fill="url(#leafGrad1)" />
    <path d="M780 -10 C 755 10 730 40 735 60 C 755 65 775 45 780 -10 Z" fill="url(#leafGradSoft)" opacity="0.6" />
    <path d="M510 70 C 495 65 480 75 475 70 C 480 60 495 55 510 70 Z" fill="#48bb78" opacity="0.7" />
  </g>

  <!-- Bottom-Right Foliage -->
  <g class="corner-bottom-right" opacity="0.85">
    <path d="M840 630 Q 730 520 640 470 T 520 440" stroke="url(#stemGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M760 550 C 720 520 670 520 650 480 C 670 460 715 470 760 550 Z" fill="url(#leafGrad1)" />
    <path d="M690 495 C 650 470 595 475 575 440 C 595 420 645 430 690 495 Z" fill="url(#leafGrad2)" />
    <path d="M610 460 C 565 445 515 455 495 425 C 515 410 560 415 610 460 Z" fill="url(#leafGrad1)" />
    <path d="M790 570 C 760 560 735 580 720 550 C 740 530 775 540 790 570 Z" fill="url(#leafGradSoft)" opacity="0.6" />
    <path d="M500 400 C 485 395 475 405 470 400 C 475 390 490 385 500 400 Z" fill="#2FA84F" opacity="0.75" />
    <path d="M460 450 C 445 445 435 455 430 450 C 435 440 450 435 460 450 Z" fill="#38a169" opacity="0.65" />
  </g>
</svg>
